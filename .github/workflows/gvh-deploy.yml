name: GVH Build & Deploy

on:
  push:
    branches: [gvh-custom]
  workflow_dispatch: # allow manual triggers

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/643search/affine
  NODE_VERSION: '22'
  RUST_TARGET: x86_64-unknown-linux-gnu

jobs:
  build-and-deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ─── Checkout ────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ─── Node.js Setup ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      # ─── Rust Setup (for server-native module) ─────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.0'
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gvh-server-native

      - name: Install clang (needed for tree-sitter)
        run: sudo apt-get update && sudo apt-get install -y clang

      # ─── Install Dependencies ──────────────────────────────────────
      - name: Install Node.js dependencies
        run: yarn install --inline-builds
        env:
          HUSKY: '0'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          SENTRYCLI_SKIP_DOWNLOAD: '1'

      # ─── Build Frontend ────────────────────────────────────────────
      - name: Build Web
        run: yarn affine @affine/web build

      - name: Build Admin
        run: yarn affine @affine/admin build

      - name: Build Mobile
        run: yarn affine @affine/mobile build

      # ─── Build Server Native (Rust) ────────────────────────────────
      - name: Build server-native
        run: yarn workspace @affine/server-native build --target ${{ env.RUST_TARGET }}
        env:
          CC: 'clang -D_BSD_SOURCE'
          TARGET_CC: 'clang -D_BSD_SOURCE'

      # ─── Build Server ──────────────────────────────────────────────
      - name: Build Server
        run: yarn workspace @affine/server build

      # ─── Prepare Docker Context ────────────────────────────────────
      - name: Install production dependencies
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production

      - name: Generate Prisma client
        run: yarn workspace @affine/server prisma generate

      - name: Move node_modules into server package
        run: mv ./node_modules ./packages/backend/server

      # ─── Docker Build & Push ───────────────────────────────────────
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: .github/deployment/node/Dockerfile
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ─── Deploy to VPS ─────────────────────────────────────────────
      - name: Deploy to Hetzner VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/gvh-affine
            docker compose pull affine affine_migration
            docker compose up -d
